[workspace]
resolver = "3"
members = ["apps/history-importer", "apps/elo-ratings", "apps/elo-tune", "apps/bayes-tune", "apps/evaluate-model", "crates/rating-core", "crates/test-support"]

[workspace.package]
version = "1.4.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
fs2 = "0.4"
# Since 0.13.5 the rustls feature verifies against the operating system trust store
# (rustls-platform-verifier), replacing the old rustls-native-certs feature.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
rating-core = { path = "crates/rating-core" }
test-support = { path = "crates/test-support" }
