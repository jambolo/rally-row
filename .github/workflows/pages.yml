name: Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Rebuild monthly so every league's published Elo seeds stay current after its configured season rollover (season_rollover_month).
    # The scheduled job limits this to the first Tuesday of each month at 09:17 UTC.
    - cron: '17 9 * * 2'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  schedule:
    name: Schedule monthly build on master
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Cron runs on the default branch; dispatch so deployment runs on master.
      - name: Dispatch on the first Tuesday
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" -le 7 ]; then
            gh workflow run pages.yml --ref master --repo "$GITHUB_REPOSITORY"
          fi

  build:
    name: Build site
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # The browser app reads these as static assets; they are generated, never committed.
      - name: Generate league data
        run: |
          cargo run --release -p import-history -- --league nfl
          cargo run --release -p generate-preseason-seed -- --league nfl
          cargo run --release -p import-history -- --league mlb
          cargo run --release -p generate-preseason-seed -- --league mlb
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Build
        run: pnpm build
        working-directory: apps/web
        env:
          VITE_BASE: ${{ format('/{0}/', github.event.repository.name) }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
