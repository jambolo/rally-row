name: Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Rebuild after each league's season rollover (season_rollover_month) so its new-season Elo seed gets published.
    # The scheduled job checks every Tuesday at 09:17 UTC and builds only while a current-season seed is missing.
    - cron: '17 9 * * 2'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  schedule:
    name: Schedule rollover build on master
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pages: read
    steps:
      # Cron runs on the default branch; read master's configuration, which the dispatched build uses.
      - uses: actions/checkout@v7
        with:
          ref: master
      # Only a rollover changes a published seed, so the build and its history downloads run only while some league's
      # current-season seed is missing from the site. A failed build is retried the next week.
      - name: Dispatch while a current-season seed is unpublished
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          year=$(date -u +%Y)
          month=$(date -u +%-m)
          missing=
          for config in config/*.json; do
            league=$(jq -r .id "$config")
            season=$(jq --argjson year "$year" --argjson month "$month" \
              'if $month < .season_rollover_month then $year - 1 else $year end' "$config")
            if ! curl -fsI -o /dev/null "${site%/}/data/$league/elo-$season.json"; then
              echo "No published $league seed for $season"
              missing=1
            fi
          done
          if [ -n "$missing" ]; then
            gh workflow run pages.yml --ref master --repo "$GITHUB_REPOSITORY"
          fi

  build:
    name: Build site
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # The browser app reads these as static assets; they are generated, never committed.
      - name: Generate league data
        run: |
          cargo run --release -p import-history -- --league nfl
          cargo run --release -p generate-preseason-seed -- --league nfl
          cargo run --release -p import-history -- --league mlb
          cargo run --release -p generate-preseason-seed -- --league mlb
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Build
        run: pnpm build
        working-directory: apps/web
        env:
          VITE_BASE: ${{ format('/{0}/', github.event.repository.name) }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
